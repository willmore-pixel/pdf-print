<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 列印工具</title>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f4f6; color: #1f2937; font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; font-size: 16px; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 22px; margin: 4px 0; }
    .sub { color: #6b7280; font-size: 14px; margin: 0 0 16px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .card h2 { font-size: 16px; margin: 0 0 12px; }
    label.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0; }
    input[type=number], select { font-size: 16px; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; color: inherit; }
    input[type=number] { width: 90px; text-align: right; }
    .btn { display: block; width: 100%; font-size: 17px; font-weight: 600; padding: 13px; border: 0; border-radius: 10px; color: #fff; background: #4f46e5; margin-top: 10px; cursor: pointer; }
    .btn:disabled { opacity: .5; }
    .btn.green { background: #059669; }
    .btn.gray { background: #6b7280; }
    .btn.light { background: #e0e7ff; color: #3730a3; }
    .file { display: block; border: 2px dashed #a5b4fc; border-radius: 10px; padding: 18px; text-align: center; color: #4338ca; font-weight: 600; cursor: pointer; }
    .file input { display: none; }
    .note { font-size: 14px; color: #4b5563; line-height: 1.6; }
    .tip { background: #ecfdf5; border-radius: 10px; padding: 10px 12px; font-size: 15px; color: #065f46; line-height: 1.6; margin-top: 12px; }
    .ok { color: #047857; } .warn { color: #b45309; } .err { color: #b91c1c; }
    details summary { cursor: pointer; font-weight: 600; font-size: 16px; }
    ol { padding-left: 20px; margin: 8px 0; }
  </style>
</head>
<body>
<main>
  <h1>PDF 列印工具</h1>
  <p class="sub">用手機印任何 PDF 也是 100% 實際大小，不用印測試頁。</p>

  <div class="card">
    <h2>1. 選 PDF 檔</h2>
    <label class="file"><input type="file" id="file" accept="application/pdf,.pdf"><span id="fileName">點這裡選檔案</span></label>
    <div id="fileInfo" class="note" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <h2>2. 設定</h2>
    <label class="row">紙張<select id="paper"><option>A4</option><option>A3</option><option>Letter</option></select></label>
    <label class="row">縮放比例 (%)<input type="number" id="pct" value="100" min="10" max="400" step="1" inputmode="decimal"></label>
  </div>

  <button class="btn" id="make" disabled>產生列印檔</button>
  <div id="msg" class="note" style="margin:8px 2px"></div>
  <div id="outBtns" style="display:none">
    <button class="btn green" id="share">分享（傳到印表機 App）</button>
    <button class="btn gray" id="open">開啟（用手機列印）</button>
    <button class="btn light" id="download">下載檔案</button>
    <div class="tip">列印時：紙張選 <b id="tipPaper">A4</b>，縮放選<b>「符合」</b>（不要選填滿），其他不用動。</div>
  </div>

  <div class="card" style="margin-top:18px">
    <details>
      <summary>更多設定（換印表機時）</summary>
      <div class="note" style="margin-top:10px">
        手機會把頁面撐滿「印表機印得到的範圍」。這個工具把頁面做成剛好那麼大，所以選「符合」就是 100%。
        預設是 HP 家用印表機 A4 的 198 × 288 mm。換印表機印出來不準時：
        <ol>
          <li>按「下載測試頁」，用「符合」印出來。</li>
          <li>量兩條 10 cm 線。橫線量到 X cm，寬就改成 目前寬 × 10 ÷ X（直線、高同理）。</li>
        </ol>
      </div>
      <label class="row"><span id="areaLabel">A4 印得到的範圍</span>
        <span><input type="number" id="aw" step="0.5" inputmode="decimal"> × <input type="number" id="ah" step="0.5" inputmode="decimal"> mm</span></label>
      <button class="btn light" id="test">下載測試頁</button>
      <button class="btn gray" id="reset">恢復預設</button>
    </details>
  </div>

  <p class="note">檔案只在你的手機上處理，不會上傳。</p>
</main>

<script>
// ===== 核心：只算 PDF =====
const MM = 72 / 25.4;
const PAPERS = { A4: [210, 297], A3: [297, 420], Letter: [215.9, 279.4] };
// 印得到的範圍預設：A4 是實測 HP；其他是每邊約 6 mm / 4.5 mm 的估計
const AREA_DEFAULT = { A4: [198, 288], A3: [285, 411], Letter: [203.9, 270.4] };

function paperOf(wPt, hPt) {
  const a = Math.min(wPt, hPt) / MM, b = Math.max(wPt, hPt) / MM;
  for (const [k, [w, h]] of Object.entries(PAPERS)) if (Math.abs(a - w) < 3 && Math.abs(b - h) < 3) return k;
  return null;
}

// 每頁改成「印得到的範圍」大小，內容 pct% 置中（超出範圍的白邊本來就印不到）
async function makePrintPdf(PDFLib, bytes, { pct, area }) {
  const src = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
  const out = await PDFLib.PDFDocument.create();
  const pages = src.getPages();
  const embedded = await out.embedPages(pages);
  const [aw, ah] = [Math.min(...area) * MM, Math.max(...area) * MM];
  const s = pct / 100;
  pages.forEach((p, i) => {
    const { width: w, height: h } = embedded[i];
    const [W, H] = w > h ? [ah, aw] : [aw, ah]; // 跟原頁同方向（旋轉照抄）
    const np = out.addPage([W, H]);
    np.drawPage(embedded[i], { x: (W - w * s) / 2, y: (H - h * s) / 2, xScale: s, yScale: s });
    const rot = ((p.getRotation().angle % 360) + 360) % 360;
    if (rot) np.setRotation(PDFLib.degrees(rot));
  });
  return { bytes: await out.save(), pageCount: pages.length };
}

// 測試頁：頁面 = 印得到的範圍，中間橫直各一條 10 cm
async function makeTestPdf(PDFLib, [w, h]) {
  const doc = await PDFLib.PDFDocument.create();
  const font = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
  const p = doc.addPage([w * MM, h * MM]);
  const k = PDFLib.rgb(0, 0, 0);
  const L = (x1, y1, x2, y2, t = 0.7) => p.drawLine({ start: { x: x1 * MM, y: y1 * MM }, end: { x: x2 * MM, y: y2 * MM }, thickness: t, color: k });
  const T = (s, x, y, z = 11) => p.drawText(s, { x: x * MM, y: y * MM, size: z, font, color: k });
  p.drawRectangle({ x: 0.5 * MM, y: 0.5 * MM, width: (w - 1) * MM, height: (h - 1) * MM, borderWidth: 0.5, borderColor: k });
  const cx = w / 2, cy = h / 2, hy = cy + 30, vx = cx - 30;
  L(cx - 50, hy, cx + 50, hy, 0.9);
  for (let i = 0; i <= 10; i++) L(cx - 50 + i * 10, hy, cx - 50 + i * 10, hy + (i % 5 ? 3 : 6));
  T('0', cx - 51.2, hy + 8); T('10 cm', cx + 46, hy + 8);
  L(vx, cy - 80, vx, cy + 20, 0.9);
  for (let i = 0; i <= 10; i++) L(vx, cy - 80 + i * 10, vx + (i % 5 ? 3 : 6), cy - 80 + i * 10);
  T('0', vx + 8, cy + 18.5); T('10 cm', vx + 8, cy - 81.5);
  T(`TEST ${w} x ${h} mm  -  print with "fit", measure both 10 cm lines`, cx - 70, cy - 100, 10);
  return doc.save();
}

// ===== 畫面 =====
const $ = id => document.getElementById(id);
const STORE = 'pdfPrintTool.v2';
let areas = {};
try { areas = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) {}
const saveAreas = () => { try { localStorage.setItem(STORE, JSON.stringify(areas)); } catch (e) {} };
const areaOf = paper => areas[paper] || AREA_DEFAULT[paper];
let srcBytes = null, srcName = '', result = null;

function clearResult() { result = null; $('outBtns').style.display = 'none'; $('msg').textContent = ''; }
function render() {
  const paper = $('paper').value, [w, h] = areaOf(paper);
  $('aw').value = w; $('ah').value = h;
  $('areaLabel').textContent = `${paper} 印得到的範圍`;
  $('tipPaper').textContent = paper;
  $('make').disabled = !srcBytes;
}

$('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  clearResult();
  if (!f) return;
  srcName = f.name.replace(/\.pdf$/i, '');
  $('fileName').textContent = f.name;
  srcBytes = new Uint8Array(await f.arrayBuffer());
  try {
    const d = await PDFLib.PDFDocument.load(srcBytes, { ignoreEncryption: true });
    const { width, height } = d.getPages()[0].getSize();
    const paper = paperOf(width, height);
    if (paper) $('paper').value = paper;
    $('fileInfo').textContent = `${d.getPageCount()} 頁，${paper || `${(width / MM).toFixed(0)} × ${(height / MM).toFixed(0)} mm`}`;
  } catch (err) {
    srcBytes = null;
    $('fileInfo').innerHTML = '<span class="err">讀不到這個檔案，可能不是 PDF 或有密碼保護。</span>';
  }
  render();
});
$('paper').addEventListener('change', () => { clearResult(); render(); });
$('pct').addEventListener('input', clearResult);
const onArea = () => {
  const w = Number($('aw').value), h = Number($('ah').value);
  if (w > 50 && h > 50) { areas[$('paper').value] = [w, h]; saveAreas(); clearResult(); }
};
$('aw').addEventListener('change', onArea);
$('ah').addEventListener('change', onArea);
$('reset').addEventListener('click', () => { delete areas[$('paper').value]; saveAreas(); clearResult(); render(); });

$('make').addEventListener('click', async () => {
  const pct = Number($('pct').value);
  if (!(pct >= 10 && pct <= 400)) { $('msg').innerHTML = '<span class="err">縮放比例請填 10 到 400。</span>'; return; }
  $('make').disabled = true; $('msg').textContent = '處理中…';
  try {
    result = await makePrintPdf(PDFLib, srcBytes, { pct, area: areaOf($('paper').value) });
    $('msg').innerHTML = `<span class="ok">好了！共 ${result.pageCount} 頁。</span>`;
    $('outBtns').style.display = 'block';
    $('share').style.display = canShare() ? 'block' : 'none';
  } catch (err) {
    console.error(err);
    $('msg').innerHTML = '<span class="err">這個檔案處理失敗（可能有密碼保護）。</span>';
  }
  $('make').disabled = false;
});

const outName = () => `${srcName}_手機列印.pdf`;
const canShare = () => { try { return !!navigator.canShare && navigator.canShare({ files: [new File([new Uint8Array(1)], 'a.pdf', { type: 'application/pdf' })] }); } catch (e) { return false; } };
function downloadBytes(bytes, name) {
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
$('share').addEventListener('click', async () => { try { await navigator.share({ files: [new File([result.bytes], outName(), { type: 'application/pdf' })] }); } catch (e) {} });
$('open').addEventListener('click', () => window.open(URL.createObjectURL(new Blob([result.bytes], { type: 'application/pdf' })), '_blank'));
$('download').addEventListener('click', () => downloadBytes(result.bytes, outName()));
$('test').addEventListener('click', async () => {
  const a = areaOf($('paper').value);
  downloadBytes(await makeTestPdf(PDFLib, a), `測試頁_${a[0]}x${a[1]}.pdf`);
});

render();
</script>
</body>
</html>
